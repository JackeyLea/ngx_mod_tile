# Valgrind configuration: single process to track memory errors deterministically
load_module /home/jackey/Documents/gitea/ngx_mod_tile/build/nginx-src/objs/ngx_http_tile_module.so;

master_process off;
daemon off;
worker_processes 1;

pid /tmp/tile-valgrind-nginx.pid;
error_log /tmp/tile-valgrind-error.log info;

thread_pool default threads=2 max_queue=256;

events {
    worker_connections 128;
}

http {
    client_body_temp_path /tmp/tile-test-body;
    proxy_temp_path /tmp/tile-test-proxy;
    fastcgi_temp_path /tmp/tile-test-fastcgi;
    uwsgi_temp_path /tmp/tile-test-uwsgi;
    scgi_temp_path /tmp/tile-test-scgi;

    access_log off;

    tile_throttling_zone 8m;

    server {
        listen 127.0.0.1:18100;
        server_name tile.local;

        tile_renderd_socket_addr unix:/tmp/tile-valgrind-renderd.sock;
        tile_tile_dir /tmp/tilestore-valgrind;
        tile_request_timeout 800ms;
        tile_missing_request_timeout 800ms;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        location /tiles/ {
            tile_layer test;
            tile_cors http://allowed.example.com;
        }

        location /opt/ {
            tile_layer test;
            tile_options on;
        }

        location /tp/ {
            tile_layer test;
        }
        tile_thread_pool default;

        location = /mod_tile {
            tile_stats on;
        }

        location = /metrics {
            tile_metrics on;
        }
    }
}
