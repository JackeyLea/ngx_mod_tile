# ngx_mod_tile network backends integration test configuration (Docker)

load_module /usr/local/nginx/modules/ngx_http_tile_module.so;

worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log info;

thread_pool default threads=4 max_queue=256;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /var/cache/nginx/body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    access_log /var/log/nginx/access.log;

    tile_throttling_zone 8m;

    server {
        listen 8080;
        server_name _;

        tile_renderd_socket_addr renderd:7654;
        tile_tile_dir /data/tiles;

        tile_request_timeout 3s;
        tile_missing_request_timeout 3s;
        tile_renderd_connect_timeout 1s;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        # filesystem backend
        location /tiles/ {
            tile_layer default;
            tile_thread_pool default;
        }

        # memcached network backend
        location /mc/ {
            tile_layer default;
            tile_tile_dir memcached://memcached:11211;
            tile_thread_pool default;
        }

        # memcached backend without thread pool (direct event-loop path)
        location /mc-sync/ {
            tile_layer default;
            tile_tile_dir memcached://memcached:11211;
        }

        # read-only HTTP proxy network backend
        location /http/ {
            tile_layer default;
            tile_tile_dir ro_http_proxy://tile-upstream:8000;
            tile_thread_pool default;
        }

        # Ceph RADOS network backend (if Ceph demo cluster is running)
        location /rados/ {
            tile_layer default;
            tile_tile_dir rados://tiles//etc/ceph/ceph.conf;
            tile_thread_pool default;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        location = /mod_tile {
            tile_stats on;
        }

        location = /metrics {
            tile_metrics on;
        }
    }
}
