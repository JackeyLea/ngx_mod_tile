# nginx config for ngx_mod_tile end-to-end tests.
# Started by tests/run_tests.sh with -c tests/nginx_tile.conf.

load_module /home/jackey/Documents/gitea/ngx_mod_tile/build/nginx-src/objs/ngx_http_tile_module.so;

worker_processes 2;
worker_rlimit_core 500M;
working_directory /tmp/tile-core;
pid /tmp/tile-test-nginx.pid;
error_log /tmp/tile-test-error.log info;

thread_pool default threads=2 max_queue=256;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/tile-test-body;
    proxy_temp_path /tmp/tile-test-proxy;
    fastcgi_temp_path /tmp/tile-test-fastcgi;
    uwsgi_temp_path /tmp/tile-test-uwsgi;
    scgi_temp_path /tmp/tile-test-scgi;

    access_log /tmp/tile-test-access.log;

    # common server settings for coverage servers
    include /home/jackey/Documents/gitea/ngx_mod_tile/tests/tile-server-common.conf;

    tile_throttling_zone 8m;

    # main server
    server {
        listen 127.0.0.1:18080;
        server_name tile.local;

        tile_renderd_socket_addr unix:/tmp/tile-test-renderd.sock;
        tile_tile_dir /tmp/tilestore;
        tile_request_timeout 800ms;
        tile_missing_request_timeout 800ms;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        # renderd.conf-imported layer (section [osmtest], uri=/imp/)
        tile_import_config /home/jackey/Documents/gitea/ngx_mod_tile/tests/renderd.conf;

        location /imp/ {
            # matcher falls back to imported layers
        }

        location /tiles/ {
            tile_layer test;
            tile_cors http://allowed.example.com;
        }

        # style parameterization: /opt/<style>/z/x/y.ext
        location /opt/ {
            tile_layer test;
            tile_options on;
        }

        location /static/ {
            root /tmp/tile-static;
        }

        location = /mod_tile {
            tile_stats on;
        }

        location = /metrics {
            tile_metrics on;
        }

        location / {
            root /tmp/tile-empty;
        }
    }

    # stage 2: per-IP throttling (small tile bucket -> 503s)
    server {
        listen 127.0.0.1:18081;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 5 0.5;
        tile_throttling_renders 100 100;

        tile_renderd_socket_addr unix:/tmp/tile-test-renderd.sock;
        tile_tile_dir /tmp/tilestore;
        tile_request_timeout 800ms;
        tile_missing_request_timeout 800ms;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        location /t8/ {
            tile_layer test;
        }
    }

    # stage 2: whitelist bypasses the throttle
    server {
        listen 127.0.0.1:18082;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 5 0.5;
        tile_throttling_renders 100 100;
        tile_throttling_whitelist 127.0.0.1;

        tile_renderd_socket_addr unix:/tmp/tile-test-renderd.sock;
        tile_tile_dir /tmp/tilestore;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        location /t8/ {
            tile_layer test;
        }
    }

    # stage 2: stats disabled message
    server {
        listen 127.0.0.1:18083;
        server_name tile.local;

        tile_enable_stats off;

        location = /mod_tile {
            tile_stats on;
        }

        location / {
            root /tmp/tile-empty;
        }
    }

    # stage 3: storage calls offloaded to a thread pool
    server {
        listen 127.0.0.1:18084;
        server_name tile.local;

        tile_thread_pool default;

        tile_renderd_socket_addr unix:/tmp/tile-test-renderd.sock;
        tile_tile_dir /tmp/tilestore;
        tile_request_timeout 800ms;
        tile_missing_request_timeout 800ms;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        location /tp/ {
            tile_layer test;
        }
    }

    # coverage: bulk mode
    server {
        listen 127.0.0.1:18085;
        server_name tile.local;

        tile_bulk_mode on;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: load shedding (threshold -1 => always over the limit)
    server {
        listen 127.0.0.1:18086;
        server_name tile.local;

        tile_max_load_old -2;
        tile_max_load_missing -2;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: render token bucket exhaustion (1 token, slow refill)
    server {
        listen 127.0.0.1:18087;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 1000 100;
        tile_throttling_renders 1 0.01;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: X-Forwarded-For mode 1 (first entry)
    server {
        listen 127.0.0.1:18088;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 3 0.01;
        tile_throttling_renders 100 100;
        tile_throttling_xforward 1;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: X-Forwarded-For mode 2 (last entry)
    server {
        listen 127.0.0.1:18089;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 3 0.01;
        tile_throttling_renders 100 100;
        tile_throttling_xforward 2;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: status/dirty endpoints disabled
    server {
        listen 127.0.0.1:18090;
        server_name tile.local;

        tile_enable_status_url off;
        tile_enable_dirty_url off;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: Cache-Control algorithm (dirty jitter, zoom tiers,
    # extended hostname, last_modified_factor clamp)
    server {
        listen 127.0.0.1:18091;
        server_name tile.local;

        tile_cache_duration_dirty 900;
        tile_cache_duration_max 604800;
        tile_cache_duration_minimum 10800;
        tile_cache_duration_low_zoom 2 3600;
        tile_cache_duration_medium_zoom 4 7200;
        tile_cache_extended_hostname cache.example.com;
        tile_cache_extended_duration 86400;
        tile_cache_last_modified_factor 0;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: last_modified_factor drives the fresh-tile max-age clamp
    server {
        listen 127.0.0.1:18092;
        server_name tile.local;

        tile_cache_duration_max 604800;
        tile_cache_duration_minimum 10800;
        tile_cache_duration_low_zoom 2 3600;
        tile_cache_duration_medium_zoom 4 7200;
        tile_cache_last_modified_factor 10;

        location /tiles/ {
            tile_layer test;
        }
    }

    # coverage: delaypool + stats shared-memory consistency across workers
    server {
        listen 127.0.0.1:18093;
        server_name tile.local;

        tile_throttling on;
        tile_throttling_tiles 6 0.01;
        tile_throttling_renders 100 100;
        tile_throttling_xforward 1;

        location /tiles/ {
            tile_layer test;
        }
    }
}

