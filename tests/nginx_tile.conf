# nginx config for ngx_mod_tile end-to-end tests.
# Started by tests/run_tests.sh with -c tests/nginx_tile.conf.

load_module /home/jackey/Documents/gitea/ngx_mod_tile/build/nginx-src/objs/ngx_http_tile_module.so;

worker_processes 1;
worker_rlimit_core 500M;
working_directory /tmp/tile-core;
pid /tmp/tile-test-nginx.pid;
error_log /tmp/tile-test-error.log info;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/tile-test-body;
    proxy_temp_path /tmp/tile-test-proxy;
    fastcgi_temp_path /tmp/tile-test-fastcgi;
    uwsgi_temp_path /tmp/tile-test-uwsgi;
    scgi_temp_path /tmp/tile-test-scgi;
    access_log /tmp/tile-test-access.log;

    server {
        listen 127.0.0.1:18080;
        server_name tile.local;

        # renderd endpoint + shared layer settings (server scope)
        tile_renderd_socket_addr unix:/tmp/tile-test-renderd.sock;
        tile_tile_dir /tmp/tilestore;
        tile_request_timeout 800ms;
        tile_missing_request_timeout 800ms;
        tile_max_load_old 1000;
        tile_max_load_missing 1000;

        # location-scoped layer (tile_layer)
        location /tiles/ {
            tile_layer test;
            tile_cors http://allowed.example.com;
        }

        # renderd.conf-imported layer (section [osmtest], uri=/imp/)
        tile_import_config /home/jackey/Documents/gitea/ngx_mod_tile/tests/renderd.conf;

        location /imp/ {
            # nothing else needed: matcher falls back to imported layers
        }

        # static files: proves tile URIs are claimed without disturbing others
        location /static/ {
            root /tmp/tile-static;
        }

        location / {
            root /tmp/tile-empty;
        }
    }
}
