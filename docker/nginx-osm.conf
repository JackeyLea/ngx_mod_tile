# tileserver configuration for the REAL rendering stack (compose profile osm).
# Layers come from the renderd container's renderd.conf via tile_import_config:
# [default] section with uri=/tiles/ becomes the /tiles/ tile layer.

load_module /usr/local/nginx/modules/ngx_http_tile_module.so;

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log info;

# main scope: stage 3 thread pool for blocking store I/O
thread_pool default threads=4 max_queue=256;

events {
    worker_connections 2048;
}

http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /var/cache/nginx/body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    access_log /var/log/nginx/access.log;

    tile_throttling_zone 8m;

    server {
        listen 8080;
        server_name _;

        tile_renderd_socket_addr unix:/run/renderd/renderd.sock;
        tile_tile_dir /data/tiles;

        tile_request_timeout 5s;
        tile_missing_request_timeout 20s;
        tile_renderd_connect_timeout 1s;
        tile_max_load_old 16;
        tile_max_load_missing 50;

        tile_throttling on;
        tile_throttling_tiles 10000 5;
        tile_throttling_renders 200 10;

        # layers parsed from the renderd container's renderd.conf
        # ([default] section: uri=/tiles/)
        tile_import_config /etc/renderd/renderd.conf;

        location /tiles/ {
            tile_thread_pool default;
            tile_cors *;
        }

        location = /index.html {
            root /usr/local/nginx/html;
        }

        location /leaflet/ {
            root /usr/local/nginx/html;
        }

        location = /healthz {
            return 200 "ok\n";
        }
        location = /mod_tile {
            tile_stats on;
        }

        location = /metrics {
            tile_metrics on;
        }
    }
}
