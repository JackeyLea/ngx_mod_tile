# renderd configuration for the real OSM rendering stack.
# The [default] map section is also parsed by ngx_http_tile_module via
# tile_import_config (uri=/tiles/, png tiles), so the tileserver picks the
# style up automatically.

[renderd]
num_threads=4
tile_dir=/data/tiles
unix_socket=/run/renderd/renderd.sock
pid_file=/run/renderd/renderd.pid

[mapnik]
plugins_dir=/usr/share/mapnik/input
font_dir=/usr/share/fonts
font_dir_recurse=1

[default]
XML=/opt/osm-carto/mapnik.xml
URI=/tiles/
TILESIZE=256
MAXZOOM=20
DESCRIPTION=OpenStreetMap carto (Baku demo)
ATTRIBUTION=&copy; OpenStreetMap contributors
