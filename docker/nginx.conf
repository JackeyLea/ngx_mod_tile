# ngx_mod_tile demo configuration (container).

load_module /usr/local/nginx/modules/ngx_http_tile_module.so;

worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log info;

# main scope (top level): stage 3 thread pool for blocking store I/O
thread_pool default threads=4 max_queue=256;

events {
    worker_connections 2048;
}

http {
    client_body_temp_path /var/cache/nginx/body;
    proxy_temp_path /var/cache/nginx/proxy;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;

    access_log /var/log/nginx/access.log;

    # stage 2: shared-memory throttling pool
    tile_throttling_zone 8m;

    server {
        listen 8080;
        server_name _;

        # demo renderd: TCP service (see docker-compose.yml); for a unix
        # socket use tile_renderd_socket_addr unix:/run/renderd/renderd.sock
        tile_renderd_socket_addr renderd:7654;
        tile_tile_dir /data/tiles;

        tile_request_timeout 3s;
        tile_missing_request_timeout 3s;
        tile_renderd_connect_timeout 1s;
        tile_max_load_old 16;
        tile_max_load_missing 50;

        # stage 2: per-IP throttling
        tile_throttling on;
        tile_throttling_tiles 5000 1;
        tile_throttling_renders 65 0.2;

        location /tiles/ {
            tile_layer default;
            tile_thread_pool default;
            tile_cors *;
        }

        # stage 3: style parameterization /styles/<style>/z/x/y.png
        location /styles/ {
            tile_layer default;
            tile_options on;
            tile_thread_pool default;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        location = /mod_tile {
            tile_stats on;
        }

        location = /metrics {
            tile_metrics on;
        }

        location / {
            root /usr/local/nginx/html;
        }
    }
}
